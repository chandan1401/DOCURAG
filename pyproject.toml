[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docurag"
version = "0.1.0"
description = "A production multimodal RAG engine with hybrid retrieval, reranking, and multi-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DocuRAG Team"}
]
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "django>=5.0.0,<6.0.0",
    "djangorestframework>=3.14.0,<4.0.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "easyocr>=1.7.0",
    "google-genai>=0.1.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docurag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: marks tests that require external live API access (skipped by default)",
]
